# Iceberg catalog "lake" backed by the REST catalog; files go to S3-compatible storage.
spark.sql.extensions                         org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake                       org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type                  rest
spark.sql.catalog.lake.uri                   http://catalog:8181
spark.sql.catalog.lake.io-impl               org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lake.warehouse             s3://warehouse/
spark.sql.catalog.lake.s3.endpoint           http://s3:9000
spark.sql.catalog.lake.s3.path-style-access  true
spark.sql.defaultCatalog                     lake
spark.sql.catalogImplementation              in-memory

# Streaming-sized execution: state stores and shuffles are per partition, so keep them few.
spark.sql.shuffle.partitions                 6
spark.sql.adaptive.enabled                   false
spark.sql.session.timeZone                   UTC
spark.sql.streaming.stateStore.providerClass org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider
spark.sql.streaming.metricsEnabled           true

# Event logs feed the Spark History Server.
spark.eventLog.enabled                       true
spark.eventLog.dir                           /home/iceberg/spark-events
spark.history.fs.logDirectory                /home/iceberg/spark-events
spark.ui.showConsoleProgress                 false
