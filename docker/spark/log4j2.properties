rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %p %c{1}: %m%n
logger.iceberg.name = org.apache.iceberg
logger.iceberg.level = warn

# Iceberg logs a GC-time warning for every ResolvingFileIO the streaming source opens; not actionable here.
logger.resolvingfileio.name = org.apache.iceberg.io.ResolvingFileIO
logger.resolvingfileio.level = error
